<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>数字まとめ | 海鮮餃子 北京</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --series:#2a78d6; --series-soft:#cde2fb;
  --good:#006300; --bad:#d03b3b; --warn:#fab219;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --series:#3987e5; --series-soft:#184f95;
    --good:#0ca30c; --bad:#e66767; --warn:#fab219;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
  --series:#3987e5; --series-soft:#184f95;
  --good:#0ca30c; --bad:#e66767; --warn:#fab219;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
h1{font-size:18px;margin:0;letter-spacing:.01em}
.stamp{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.banner{display:none;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--series-soft);color:var(--ink);font-size:13px}
.banner.on{display:block}
h2{font-size:15px;margin:32px 0 10px;color:var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
h2 .ttl{white-space:nowrap}
h2 .fresh{font-size:11.5px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:4px}
.brow{display:grid;grid-template-columns:minmax(64px,26%) 1fr auto;align-items:center;gap:10px;
  padding:7px 6px;border-radius:8px;margin:0 -6px}
.brow:hover{background:var(--grid)}
.blab{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:15px;display:block}
.btrack i{display:block;height:100%;background:var(--series);border-radius:4px;min-width:3px}
.bnum{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px}
.card + .card{margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 14px}
.tile .lab{font-size:12px;color:var(--ink2);margin-bottom:2px}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.tile .sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.tile .dl{font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.dl.up{color:var(--good)} .dl.dn{color:var(--bad)} .dl.flat{color:var(--muted)}
.chart-t{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.blabel{fill:var(--ink2);font-size:12px}
.bval{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:18px 2px;text-align:center;border:1px dashed var(--ring);border-radius:10px}
.empty b{display:block;color:var(--ink2);font-weight:600;margin-bottom:3px;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:500;font-size:11.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
.tt{position:fixed;pointer-events:none;z-index:9;background:var(--surface);border:1px solid var(--ring);
  border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;transition:opacity .1s}
.tt.on{opacity:1}
.tt .d{color:var(--muted);font-size:11px}
.tt .v{font-weight:600;font-variant-numeric:tabular-nums}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--grid);font-size:12px;color:var(--muted)}
footer p{margin:6px 0}
.srcs{list-style:none;padding:0;margin:8px 0 0}
.srcs li{padding:3px 0}
.srcs b{color:var(--ink2);font-weight:600}
.tblwrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>海鮮餃子 北京 &nbsp;数字まとめ</h1>
    <div class="stamp" id="stamp">読み込み中</div>
  </header>
  <div class="banner" id="banner"></div>

  <h2><span class="ttl">ホームページ</span><span class="fresh" id="f-hp"></span></h2>
  <div class="tiles" id="hp-tiles"></div>
  <div class="card" style="margin-top:12px">
    <p class="chart-t">14日間のユーザー数</p>
    <div id="hp-trend"></div>
  </div>
  <div class="card">
    <p class="chart-t">よく見られたページ</p>
    <div id="hp-pages"></div>
  </div>
  <div class="card">
    <p class="chart-t">どこから来たか</p>
    <div id="hp-ch"></div>
  </div>

  <h2><span class="ttl">Google（お店の情報）</span><span class="fresh" id="f-g"></span></h2>
  <div class="tiles" id="g-tiles"></div>

  <h2><span class="ttl">SNS</span><span class="fresh" id="f-sns"></span></h2>
  <div class="card"><div id="sns-body"></div></div>

  <footer>
    <p>このページは公開用ではありません。数字は自動で書き込まれたファイルを読んで表示しています。</p>
    <ul class="srcs" id="srcs"></ul>
  </footer>
</div>
<div class="tt" id="tt"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var demo=/[?&]demo=1/.test(location.search);
var FILE=demo?"/data/kpi.demo.json":"/data/kpi.json";
var tt=$("tt");

function nf(n){return (n==null||isNaN(n))?"-":Number(n).toLocaleString("ja-JP")}
function secs(s){if(s==null)return"-";var m=Math.floor(s/60),r=Math.round(s%60);return m>0?(m+"分"+r+"秒"):(r+"秒")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function svgEl(t,a){var e=document.createElementNS("http://www.w3.org/2000/svg",t);for(var k in a)e.setAttribute(k,a[k]);return e}
function showTT(html,x,y){tt.innerHTML=html;tt.classList.add("on");
  var w=tt.offsetWidth,h=tt.offsetHeight,L=x+12,T=y-h-12;
  if(L+w>innerWidth-8)L=x-w-12; if(L<8)L=8; if(T<8)T=y+16;
  tt.style.left=L+"px";tt.style.top=T+"px";}
function hideTT(){tt.classList.remove("on")}

function emptyBox(el,title,msg){
  el.innerHTML='<div class="empty"><b>'+esc(title)+'</b>'+esc(msg)+'</div>';
}
function tile(lab,val,sub,delta){
  var d="";
  if(delta&&delta.pct!=null){
    var c=delta.pct>0?"up":(delta.pct<0?"dn":"flat");
    var mark=delta.pct>0?"＋":(delta.pct<0?"−":"±");
    d='<div class="dl '+c+'">'+mark+Math.abs(delta.pct).toFixed(0)+"% "+esc(delta.label||"")+"</div>";
  }
  return '<div class="tile"><div class="lab">'+esc(lab)+'</div><div class="val">'+val+
         '</div>'+(sub?'<div class="sub">'+esc(sub)+"</div>":"")+d+"</div>";
}

/* ---- 折れ線（1系列・凡例なし・クロスヘア・実寸描画） ---- */
function lineChart(el,rows,unit){
  if(!rows||!rows.length){emptyBox(el,"まだ数字がありません","データが溜まると、ここに日ごとの人数が線で出ます");return}
  function draw(){
    var W=Math.max(280,el.clientWidth||320), H=W<420?170:210;
    var mL=30,mR=8,mT=12,mB=24,iw=W-mL-mR,ih=H-mT-mB;
    var vals=rows.map(function(r){return r.value||0});
    var max=Math.max.apply(null,vals),lo=0,top=max<=4?4:Math.ceil(max*1.15/4)*4;
    var X=function(i){return mL+(rows.length<2?iw/2:iw*i/(rows.length-1))};
    var Y=function(v){return mT+ih-(ih*(v-lo)/(top-lo||1))};
    var s=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:W,height:H,role:"img","aria-label":"日ごとのユーザー数の推移"});
    var i,g,steps=W<420?3:4;
    for(i=0;i<=steps;i++){var yv=lo+(top-lo)*i/steps,y=Y(yv);
      s.appendChild(svgEl("line",{x1:mL,y1:y,x2:W-mR,y2:y,"class":i===0?"axisline":"gridline"}));
      g=svgEl("text",{x:mL-6,y:y+3.5,"class":"tick","text-anchor":"end"});g.textContent=nf(Math.round(yv));s.appendChild(g)}
    var every=Math.ceil(rows.length/(W<420?3:5));
    for(i=0;i<rows.length;i++){ if(i%every&&i!==rows.length-1)continue;
      g=svgEl("text",{x:X(i),y:H-7,"class":"tick","text-anchor":i===0?"start":(i===rows.length-1?"end":"middle")});
      g.textContent=rows[i].label;s.appendChild(g)}
    var d="";for(i=0;i<rows.length;i++)d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(vals[i]).toFixed(1)+" ";
    s.appendChild(svgEl("path",{d:d,fill:"none",stroke:"var(--series)","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    var cross=svgEl("line",{x1:0,y1:mT,x2:0,y2:mT+ih,stroke:"var(--axis)","stroke-width":1,opacity:0});s.appendChild(cross);
    var dot=svgEl("circle",{r:4.5,fill:"var(--series)",stroke:"var(--surface)","stroke-width":2,opacity:0});s.appendChild(dot);
    s.appendChild(svgEl("rect",{x:0,y:0,width:W,height:H,fill:"transparent"}));
    function move(ev){
      var b=s.getBoundingClientRect(),px=(ev.touches?ev.touches[0].clientX:ev.clientX);
      var rel=(px-b.left)/b.width*W,idx=0,best=1e9;
      for(var k=0;k<rows.length;k++){var dd=Math.abs(X(k)-rel);if(dd<best){best=dd;idx=k}}
      var cx=X(idx),cy=Y(vals[idx]);
      cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.setAttribute("opacity",1);
      dot.setAttribute("cx",cx);dot.setAttribute("cy",cy);dot.setAttribute("opacity",1);
      showTT('<div class="d">'+esc(rows[idx].full||rows[idx].label)+'</div><div class="v">'+nf(vals[idx])+(unit||"")+"</div>",
        b.left+cx/W*b.width, b.top+cy/H*b.height);
    }
    function out(){cross.setAttribute("opacity",0);dot.setAttribute("opacity",0);hideTT()}
    s.addEventListener("mousemove",move);s.addEventListener("mouseleave",out);
    s.addEventListener("touchstart",move,{passive:true});s.addEventListener("touchmove",move,{passive:true});s.addEventListener("touchend",out);
    el.innerHTML="";el.appendChild(s);
  }
  draw();
  var t;addEventListener("resize",function(){clearTimeout(t);t=setTimeout(draw,150)});
}

/* ---- 横棒（HTMLで描画・1色・値を直接ラベル） ---- */
function barChart(el,rows,emptyTitle,emptyMsg,unit){
  if(!rows||!rows.length){emptyBox(el,emptyTitle,emptyMsg);return}
  rows=rows.slice(0,6);
  var max=Math.max.apply(null,rows.map(function(r){return r.value||0}))||1;
  var wrap=document.createElement("div");wrap.className="bars";
  rows.forEach(function(r){
    var row=document.createElement("div");row.className="brow";
    row.innerHTML='<span class="blab" title="'+esc(r.full||r.label)+'">'+esc(r.label)+'</span>'+
      '<span class="btrack"><i style="width:'+Math.max(1.5,(r.value||0)/max*100).toFixed(1)+'%"></i></span>'+
      '<span class="bnum">'+nf(r.value)+esc(unit||"")+"</span>";
    row.addEventListener("mousemove",function(ev){
      showTT('<div class="d">'+esc(r.full||r.label)+'</div><div class="v">'+nf(r.value)+esc(unit||"")+"</div>",ev.clientX,ev.clientY)});
    row.addEventListener("mouseleave",hideTT);
    wrap.appendChild(row);
  });
  el.innerHTML="";el.appendChild(wrap);
}

function fresh(elId,src){
  var e=$(elId); if(!e)return;
  if(!src){e.textContent="";return}
  e.textContent=(src.as_of?src.as_of+" 時点":"")+(src.note?"　"+src.note:"");
}

function render(d){
  $("stamp").textContent="最終更新 "+(d.updated_label||d.updated_at||"-");
  if(demo){var b=$("banner");b.className="banner on";
    b.textContent="これはサンプル表示です。数字はすべて架空のもので、実際のアクセスではありません。";}

  var hp=d.hp||{},y=hp.yesterday||{};
  fresh("f-hp",hp.source);
  if(hp.status==="ok"){
    $("hp-tiles").innerHTML=
      tile("ユーザー",nf(y.users),y.label||"昨日",y.users_delta)+
      tile("セッション",nf(y.sessions),y.label||"昨日",y.sessions_delta)+
      tile("ページの表示",nf(y.pageviews),y.label||"昨日",y.pageviews_delta)+
      tile("平均の滞在",secs(y.avg_engagement_sec),y.label||"昨日",null);
  }else{
    $("hp-tiles").innerHTML='<div class="tile" style="grid-column:1/-1"><div class="lab">ホームページの数字</div>'+
      '<div class="val" style="font-size:16px;font-weight:500;line-height:1.5">'+esc(hp.message||"準備中です")+"</div></div>";
  }
  lineChart($("hp-trend"),hp.trend,"人");
  barChart($("hp-pages"),hp.top_pages,"まだ数字がありません","どのページがよく見られたかが、ここに並びます","");
  barChart($("hp-ch"),hp.channels,"まだ数字がありません","XやInstagramなど、どこから来たかがここに並びます","人");

  var g=d.google||{};
  fresh("f-g",g.source);
  if(g.status==="ok"){
    $("g-tiles").innerHTML=
      tile("見られた回数",nf(g.impressions),g.period||"",g.impressions_delta)+
      tile("ルート検索",nf(g.directions),g.period||"",g.directions_delta)+
      tile("電話をかけた",nf(g.calls),g.period||"",g.calls_delta)+
      tile("クチコミ",(g.rating!=null?g.rating.toFixed(1):"-"),nf(g.reviews)+"件",null);
  }else{
    $("g-tiles").innerHTML='<div class="tile" style="grid-column:1/-1"><div class="lab">Googleのお店の情報</div>'+
      '<div class="val" style="font-size:16px;font-weight:500;line-height:1.5">'+esc(g.message||"準備中です")+"</div></div>";
  }

  var sns=d.sns||{};
  fresh("f-sns",sns.source);
  var sb=$("sns-body");
  if(sns.status==="ok"&&sns.posts&&sns.posts.length){
    var h='<div class="tblwrap"><table><thead><tr><th>投稿</th><th>面</th><th class="n">表示</th><th class="n">いいね</th></tr></thead><tbody>';
    sns.posts.forEach(function(p){
      h+="<tr><td>"+esc(p.title)+"</td><td>"+esc(p.platform)+'</td><td class="n">'+nf(p.views)+'</td><td class="n">'+nf(p.likes)+"</td></tr>"});
    sb.innerHTML=h+"</tbody></table></div>";
  }else{
    emptyBox(sb,"まだつながっていません",sns.message||"投稿台帳が読めるようになると、直近の投稿と反応がここに並びます");
  }

  var ul=$("srcs");ul.innerHTML="";
  (d.sources_note||[]).forEach(function(s){
    var li=document.createElement("li");li.innerHTML="<b>"+esc(s.name)+"</b>　"+esc(s.detail);ul.appendChild(li)});
}

fetch(FILE,{cache:"no-store"}).then(function(r){
  if(!r.ok)throw new Error(r.status); return r.json();
}).then(render).catch(function(e){
  $("stamp").textContent="読み込めませんでした";
  $("hp-tiles").innerHTML='<div class="tile" style="grid-column:1/-1"><div class="lab">エラー</div>'+
   '<div class="val" style="font-size:15px;font-weight:500;line-height:1.5">数字のファイル（'+esc(FILE)+'）が読めませんでした。</div></div>';
});
})();
</script>
</body>
</html>
