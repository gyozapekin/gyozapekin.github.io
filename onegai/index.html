<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>北京 作業場 お願いリスト</title>
<style>
:root{color-scheme:light;--ink:#1d1d1f;--sub:#6b6b70;--line:#e4e2dc;--bg:#f7f6f2;--card:#fff;
--yasu:#b5523b;--hiro:#2f6f8f;--koji:#6a5a2e;--none:#8a8a8a;--red:#9b2c2c;--ok:#2f7a4a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;overflow-x:clip}
header{background:#1f1d1a;color:#f3efe6;padding:20px 0 16px}
header h1{margin:0;font-size:clamp(20px,3vw,26px);line-height:1.3}
header p{margin:6px 0 0;font-size:13.5px;color:#cfc8b8}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(3vw,12px)}
.bar{position:sticky;top:0;z-index:5;background:rgba(247,246,242,.97);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px max(3vw,12px)}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;color:var(--ink);min-height:40px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab b{font-weight:600;margin-left:5px}
.spacer{flex:1}
.btn{border:0;border-radius:8px;padding:9px 14px;font-size:14.5px;cursor:pointer;background:var(--ink);color:#fff;min-height:40px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible{outline:3px solid #e8b84a;outline-offset:2px}
.status{font-size:13px;color:var(--sub)}
.status.dirty{color:var(--red);font-weight:600}
.note{font-size:13.5px;color:var(--sub);margin:14px 0 0}
h2.sec{font-size:18px;margin:24px 0 4px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-size:13px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:14px;padding:10px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border-top:5px solid var(--none)}
.card[data-who="やすよさん"]{border-top-color:var(--yasu)}
.card[data-who="ひろ"]{border-top-color:var(--hiro)}
.card[data-who="工事屋さん"]{border-top-color:var(--koji)}
.card[data-who="対象外"]{opacity:.55}
.card.done{background:#f1f6f2}
.card.done .place{text-decoration:line-through;text-decoration-color:#9bb8a4}
.ph{display:grid;gap:2px;background:#ddd;grid-template-columns:repeat(3,1fr)}
.ph.n1{grid-template-columns:1fr}.ph.n2{grid-template-columns:1fr 1fr}
.ph img{width:100%;height:120px;object-fit:cover;display:block;cursor:zoom-in}
.ph.n1 img{height:220px}.ph.n2 img{height:170px}
.nophoto{padding:20px;text-align:center;color:var(--sub);font-size:13px;background:#f0eee8}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.no{font-weight:700;font-size:13px;color:var(--sub)}
.prio{font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid var(--line);color:var(--sub);background:#fff;font-family:inherit}
.prio.高{border-color:var(--red);color:var(--red);font-weight:700}
.freq{font-size:12.5px;font-weight:700;color:#fff;background:#1f1d1a;border-radius:4px;padding:2px 8px}
.place{font-size:17px;font-weight:700;margin:0}
.task{font-size:14.5px;margin:0}
.memo{font-size:13px;color:var(--sub);margin:0}
.edit [data-f]{border-radius:4px;cursor:text;outline:none}
.edit [data-f]:hover{background:#f3f0e8}
.edit [data-f]:focus{background:#fff8e6;box-shadow:0 0 0 2px #e8d9a8}
.edit .memo:empty::before{content:"メモを追加";color:#b9b5aa}
.done-row{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px}
.done-row input{width:20px;height:20px;accent-color:var(--ok)}
.done-row label{cursor:pointer}
.report{width:100%;min-height:44px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfaf7;resize:vertical}
.report::placeholder{color:#aaa59a}
.assign{display:none;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.edit .assign{display:flex}
.assign button{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:#fff;color:var(--ink);min-height:36px}
.assign button.on-yasu{background:var(--yasu);color:#fff;border-color:var(--yasu)}
.assign button.on-hiro{background:var(--hiro);color:#fff;border-color:var(--hiro)}
.assign button.on-koji{background:var(--koji);color:#fff;border-color:var(--koji)}
.assign button.on-none{background:#ccc;color:#333;border-color:#ccc}
.empty{color:var(--sub);padding:20px 0}
.foot{padding:20px 0 50px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:20}
#lb.show{display:flex}
#lb img{max-width:94vw;max-height:90vh}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:30;max-width:90vw}
@media(max-width:600px){.ph img{height:96px}.ph.n1 img{height:200px}.ph.n2 img{height:140px}}

.hero{padding:clamp(24px,5vw,48px) 0 8px}
.hero h2{font-size:clamp(22px,4vw,30px);margin:0 0 6px}
.hero p{color:var(--sub);margin:0}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px;padding:22px 0}
.person{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#fff;border-radius:14px;padding:26px 22px;min-height:150px;justify-content:flex-end;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.person:focus-visible{outline:3px solid #e8b84a;outline-offset:3px}
.person .nm{font-size:30px;font-weight:700;line-height:1.1}
.person .ct{font-size:15px;opacity:.92}
.person .go{font-size:13.5px;opacity:.85;margin-top:6px}
.p-hiro{background:var(--hiro)}.p-yasu{background:var(--yasu)}.p-koji{background:var(--koji)}
.sub{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:18px 0 40px;border-top:1px solid var(--line);margin-top:10px}
.sub a{color:var(--ink)}
.loginbox{max-width:460px;margin:clamp(24px,6vw,60px) auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.loginbox h2{margin:0 0 8px;font-size:22px}
.loginbox p{color:var(--sub);font-size:14.5px;margin:8px 0}
.lbl{display:block;font-size:14px;font-weight:600;margin:14px 0 4px}
.inp{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfaf7}
.inp:focus{outline:3px solid #e8d9a8;border-color:#e8d9a8}
.btn.wide{width:100%;margin-top:16px;min-height:50px;font-size:16px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font:inherit;font-size:16px;font-weight:600;border:1px solid #dadce0;border-radius:10px;background:#fff;color:#3c4043;padding:12px 16px;cursor:pointer;min-height:50px;margin-top:14px}
.gbtn:disabled{opacity:.5}
.warn{background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px;padding:12px 14px;font-size:14px;color:#6b4e12;margin-top:12px}
.warn a{color:#6b4e12;font-weight:700}
.ok{background:#eef6f0;border:1px solid #c9e2d0;border-radius:10px;padding:12px 14px;font-size:14.5px;color:#245c37;margin-top:12px}
.ok a{color:#245c37;font-weight:700;margin-right:12px}
</style>
</head>
