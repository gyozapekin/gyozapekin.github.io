<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ja' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">

<!-- 基本メタ情報 -->
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.title }}">

<!-- OGP / Twitter Card -->
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{% if page.image %}{{ site.url }}{{ page.image }}{% else %}{{ site.url }}/images/ogp-default.jpg{% endif %}">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<!-- 構造化データ: LocalBusiness（飲食店） -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "name": "{{ site.restaurant.name }}",
  "url": "{{ site.url }}",
  "telephone": "{{ site.restaurant.phone }}",
  "email": "{{ site.restaurant.email }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "宮之阪 1-19-2",
    "addressLocality": "枚方市",
    "addressRegion": "大阪府",
    "postalCode": "573-0022",
    "addressCountry": "JP"
  },
  "servesCuisine": ["中華料理", "餃子", "海鮮餃子"]
}
</script>

<!-- スタイル -->
<link rel="stylesheet" href="/css/news.css">

<!-- ヘッダー/ナビ/背景をメインサイト（index.html）と統一 -->
<style>
  /* 餃子写真の背景（メインページと統一） */
  html,body{margin:0;padding:0;}
  body{background-color:#1a0800;background-image:url('/images/bg.PNG');background-attachment:fixed;background-size:cover;background-position:center center;background-repeat:no-repeat;}
  /* 幅860pxの半透明ラッパー（メインページと統一） */
  .site-wrapper{max-width:860px;margin:0 auto;background:rgba(255,255,255,0.6);box-shadow:0 0 28px rgba(0,0,0,0.55);min-height:100vh;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);overflow:hidden;}
  .site-header{background:#F2B800;text-align:center;overflow:hidden;padding:0;}
  .site-header a{display:block;}
  .site-header img.logo{width:100%;max-width:620px;height:auto;display:block;margin:0 auto;}
  .site-nav{background:#ffffff;border-bottom:2px solid #ddd;border-top:1px solid #ccc;}
  .site-nav ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;margin:0;padding:0;}
  .site-nav ul li{margin:0;}
  .site-nav ul li a{display:block;padding:10px 13px;font-size:13px;font-weight:500;color:#111;text-decoration:none;white-space:nowrap;transition:background .2s;}
  .site-nav ul li a:hover,.site-nav ul li a.active{background:#F2B800;color:#333;font-weight:bold;text-decoration:none;}
  .site-nav ul li a.lang-switch{background:#c0392b;color:#fff;font-weight:bold;border-radius:4px;margin:4px;padding:6px 14px;}
  .site-nav ul li a.lang-switch:hover{background:#e74c3c;color:#fff;}
  /* コンテンツはラッパー内に直接配置（カードの二重化を避ける） */
  .site-main{max-width:none;margin:0;padding:28px 26px 44px;background:transparent;border-radius:0;box-shadow:none;}
  .site-footer{margin-top:0;}
  @media(max-width:640px){.site-nav ul li a{padding:8px 8px;font-size:11px;}.site-main{padding:20px 16px 32px;}}
</style>

<!-- Favicon -->
<link rel="icon" type="image/png" href="/images/favicon.png">

<!-- RSSフィード -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} お知らせ" href="/feed.xml">
</head>

<body>

<!-- 幅860pxラッパー（メインサイトと統一） -->
<div class="site-wrapper">

<!-- ヘッダー（メインサイトと統一：黄色バナー） -->
<header class="site-header">
  <a href="/" class="logo-link" aria-label="海鮮餃子 北京 ホーム">
    <img src="/images/logo_banner.png" alt="海鮮餃子 北京" class="logo"
         onerror="this.style.display='none'; this.parentElement.innerHTML='<h1 style=\'margin:0;color:#c0392b;font-size:2rem;\'>海鮮餃子 北京</h1>';">
  </a>
</header>

<!-- メインナビゲーション（メインサイトと統一） -->
<nav class="site-nav" aria-label="メインメニュー">
  <ul>
    <li><a href="/">ホーム</a></li>
    <li><a href="/order.html">ネットショップ：ECサイト</a></li>
    <li><a href="/menu.html">メニュー</a></li>
    <li><a href="/about.html">店舗紹介</a></li>
    <li><a href="/howto.html">餃子の焼き方</a></li>
    <li><a href="/news/" class="active">ブログ</a></li>
    <li><a href="/gallery.html">ギャラリー</a></li>
    <li><a href="/contact.html">お問合わせ</a></li>
    <li><a href="/en/" class="lang-switch">English</a></li>
  </ul>
</nav>

<!-- メインコンテンツ -->
<main class="site-main">
  {{ content }}
</main>

<!-- フッター -->
<footer class="site-footer">
  <nav class="footer-nav">
    <a href="/">ホーム</a>
    <a href="/menu.html">メニュー</a>
    <a href="/about.html">店舗紹介</a>
    <a href="/contact.html">お問合わせ</a>
    <a href="/news/">ブログ</a>
  </nav>
  <p class="copyright">&copy; 海鮮餃子 北京 All Rights Reserved.</p>
  <p class="address">{{ site.restaurant.address }}　電話: <a href="tel:{{ site.restaurant.phone }}">{{ site.restaurant.phone }}</a></p>
</footer>

</div>
</body>
</html>
